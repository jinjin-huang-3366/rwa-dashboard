<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RWA Dashboard Logo</title>
  <desc id="desc">Rounded square with blue gradient and interlinked chain/ribbon mark forming the letters R and W.</desc>

  <!-- Background rounded square -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"></stop>
      <stop offset="1" stop-color="#06B6D4"></stop>
    </linearGradient>
    <linearGradient id="mark" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.95"></stop>
      <stop offset="1" stop-color="#E5F2FF" stop-opacity="0.95"></stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)"></rect>

  <!-- Interlinked “RWA” ribbon/chain mark -->
  <g filter="url(#soft)">
    <!-- Left loop (R) -->
    <path d="M156 208c0-44 36-80 80-80h40c22 0 40 18 40 40s-18 40-40 40h-40v32h40c44 0 80 36 80 80v8" stroke="url(#mark)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
    <!-- Right loop (W/A implied by angles) -->
    <path d="M140 320l40 56 56-80 56 80 40-56" stroke="url(#mark)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
  </g>
</svg>
